    <script type="text/javascript">
      function googleTranslateElementInit() {
        if (window.google && window.google.translate) {

      // High-performance non-blocking suppressor for external banner layout shifts
      (function() {
        function killTranslateBanner() {
          var frames = document.querySelectorAll('.goog-te-banner-frame, .VIpgJd-ZVi9od-ORHb-OEVmcb, .VIpgJd-ZVi9od-aZ2wEe-wOHMyf, iframe[id*="container"], iframe[id*="banner"]');
          for (var i = 0; i < frames.length; i++) {
            frames[i].style.display = 'none';
            frames[i].style.visibility = 'hidden';
            frames[i].style.height = '0px';
          }
          if (document.body && document.body.style.top && document.body.style.top !== '0px') {
            document.body.style.top = '0px';
          }
          if (document.documentElement && document.documentElement.style.top && document.documentElement.style.top !== '0px') {
            document.documentElement.style.top = '0px';
          }
        }
        if (typeof window !== 'undefined' && 'MutationObserver' in window) {
          var observer = new MutationObserver(function() {
            killTranslateBanner();
          });
          document.addEventListener('DOMContentLoaded', function() {
            observer.observe(document.documentElement, { childList: true, subtree: true, attributes: true });
          });
        }
        setInterval(killTranslateBanner, 1000);
      })();

    <script>
      // Suppress transient dev WebSocket / HMR disconnect noise in iframe preview
      (function() {
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = (reason && (reason.message || (typeof reason === 'string' ? reason : ''))) || '';
          if (/websocket|failed to connect/i.test(msg)) {
            event.preventDefault();
            event.stopImmediatePropagation && event.stopImmediatePropagation();
          }
        });
        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || '')) || '';
          if (/websocket|failed to connect/i.test(msg)) {
            event.preventDefault();
            event.stopImmediatePropagation && event.stopImmediatePropagation();

        });
